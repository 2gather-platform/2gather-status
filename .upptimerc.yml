owner: 2gather-platform
repo: 2gather-status

# Liste blanche explicite des secrets passés aux workflows. Sans cette clé,
# Upptime bascule en mode automatique et expose un contexte de secrets bien
# plus large que nécessaire. Ajouter ici le nom de tout nouveau secret,
# y compris les clés NOTIFICATION_* le jour où une alerte temps réel est
# branchée : quand `secrets` est présent, c'est la liste complète.
secrets:
  - API_EVENTS_URL
  - ADMIN_APP_URL
  - ADMIN_EVENTS_URL
  - ADMIN_ME_URL

# Chaque service porte un `slug` explicite. Sans lui, l'identifiant est dérivé
# du nom affiché, et renommer un service renomme son fichier d'historique, donc
# perd sa disponibilité passée. Le nom devient libre, la mesure reste continue.
sites:
  # Deux sondes sur l'API, et c'est délibéré. La première répond sans toucher
  # ni la base ni le cache : elle reste verte quand PostgreSQL est tombé. La
  # seconde lit réellement la base. Les deux ensemble distinguent un processus
  # mort d'une base morte.
  #
  # Seule la sonde de vie affiche son adresse : elle ne rend qu'un statut et un
  # horodatage. La sonde de lecture passe par un secret, parce que la publier
  # reviendrait à indexer, depuis une page suivie par les robots, un point
  # d'entrée qui rend des données. Elle est bornée à un enregistrement : ce qui
  # est vérifié, c'est que la lecture aboutit, pas le volume rendu.
  - name: API
    slug: api
    url: https://api.2-gather.app/api/health
    maxResponseTime: 2000
    __dangerous__body_down_if_text_missing: '"status":"ok"'
  - name: API, accès base de données
    slug: api-acces-base-de-donnees
    url: $API_EVENTS_URL
    maxResponseTime: 2000
    __dangerous__body_down_if_text_missing: "pagination"

  # Chaque cible vérifie aussi le contenu de la réponse. Upptime accepte par
  # défaut les codes 200 à 308, redirections comprises, et suit celles-ci : un
  # service qui redirigerait vers une page d'erreur, ou qui rendrait une coquille
  # vide en 200, passerait pour opérationnel. Le marqueur est une marque de
  # l'interface, pas un fragment de mise en page, pour ne pas virer au rouge au
  # premier changement de gabarit.
  - name: Application web événements
    slug: application-web-evenements
    url: https://2gather.events
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: "2gather"
  - name: Application web profils
    slug: application-web-profils
    url: https://2gather.me
    maxResponseTime: 3000
    __dangerous__body_down_if_text_missing: "2gather"

  # Le domaine que l'application web déclare comme le sien, et sur lequel elle
  # annonce ses pages légales. Il n'a longtemps été servi par rien, et cette
  # sonde a été ajoutée alors qu'elle était rouge : une panne connue que
  # personne ne mesure est une panne dont personne ne suit la résolution.
  - name: Domaine principal
    slug: domaine-principal
    url: https://2-gather.app
    maxResponseTime: 3000

  # Sonde distincte, et pas une redondance. Le domaine principal peut très bien
  # répondre alors que ce fichier reste introuvable : servir une application et
  # servir `/.well-known/` sont deux règles différentes. Or c'est ce fichier que
  # le système d'exploitation va chercher pour décider qu'un lien partagé ouvre
  # l'application plutôt que le navigateur. Son absence ne produit aucune erreur
  # visible, elle dégrade silencieusement chaque lien partagé.
  #
  # Cette sonde ne couvre qu'une des deux plateformes mobiles. L'autre attend
  # son propre fichier, et son état ne se déduit pas de celui-ci.
  - name: Liens universels des applications
    slug: liens-universels
    url: https://2-gather.app/.well-known/apple-app-site-association
    maxResponseTime: 3000

  # Les trois consoles d'administration sont surveillées par URL secrète.
  # L'état est public, l'adresse ne l'est pas : Upptime écrit le nom du
  # secret dans history/ et n'affiche aucun lien sur la page de statut.
  #
  # Le seuil de la console événements est plus large que les autres parce que
  # le chemin runner vers origine y est mesurablement plus lent, 1605 et
  # 2270 ms relevés contre 438 à 648 ms ailleurs. Lui appliquer le seuil
  # commun produirait un dégradé permanent qui ne signalerait rien.
  - name: Administration, production
    slug: administration-production
    url: $ADMIN_APP_URL
    maxResponseTime: 2000
    __dangerous__body_down_if_text_missing: "2gather"
  - name: Administration, événements
    slug: administration-evenements
    url: $ADMIN_EVENTS_URL
    maxResponseTime: 4000
    __dangerous__body_down_if_text_missing: "2gather"

  # Cette console est derrière un portail d'authentification qui répond à sa
  # place : la sonde reçoit la page de connexion du portail, jamais la console.
  # Elle mesure donc que le nom résout, que TLS s'établit et que le portail
  # sert la demande. Elle ne dit rien de la console derrière, qui peut être
  # tombée sans que cet état bouge. Le nom l'annonce plutôt que de laisser
  # croire à une mesure qu'elle ne fait pas.
  #
  # Aucun marqueur de contenu ici : le seul disponible est celui du portail, et
  # l'écrire dans un fichier public nommerait la protection d'un hôte tenu
  # secret. Vérifier la console elle-même suppose un jeton de service du
  # portail, passé en en-tête depuis un secret.
  - name: Administration, profils (portail d'accès)
    slug: administration-profils
    url: $ADMIN_ME_URL
    maxResponseTime: 2000

status-website:
  # Sans domaine propre, GitHub Pages sert le site sous le nom du dépôt, et
  # cette clé doit le suivre. Restée à /upptime après le transfert du dépôt,
  # elle faisait chercher scripts et styles sous un chemin vide : la page
  # s'affichait sans mise en page, figée sur ses indicateurs de chargement.
  baseUrl: /2gather-status
  name: État des services 2gather
  introTitle: État des services 2gather
  # La cadence annoncée est celle qui est mesurée, pas celle qui est demandée.
  # Le cron réclame cinq minutes, GitHub retarde les tâches planifiées sous
  # charge et en abandonne certaines : médiane de 29 minutes sur 28 relevés
  # consécutifs, jusqu'à 84. Annoncer cinq minutes sur une page de statut
  # serait faux, et faux sur le seul chiffre qui borne le délai de détection.
  # Chiffre à revoir périodiquement, la charge de GitHub n'étant pas stable.
  introMessage: >-
    Disponibilité des services 2gather, mesurée depuis les runners GitHub
    Actions, donc hors de l'infrastructure surveillée. Le relevé est demandé
    toutes les cinq minutes et GitHub le livre en pratique toutes les trente
    minutes environ, parfois moins souvent. Une interruption plus courte que
    cet intervalle peut donc passer inaperçue. Chaque mesure est ajoutée à
    l'historique public du dépôt, et une interruption ouvre une issue datée,
    close au rétablissement.

  # Thème aux couleurs de la marque, servi depuis assets/. Tout fichier de ce
  # répertoire est publié tel quel à la racine du site.
  themeUrl: https://2gather-platform.github.io/2gather-status/2gather.css

  # Logo et icônes sont servis par la page elle-même, depuis assets/, et non par
  # 2gather.events : ce domaine répond `Cross-Origin-Resource-Policy: same-site`,
  # et le navigateur refuse alors d'afficher ses images sur github.io. Le logo
  # de la barre restait vide et l'onglet sans icône. L'image Open Graph peut
  # rester là-bas : les robots qui la lisent n'appliquent pas cette règle.
  logoUrl: https://2gather-platform.github.io/2gather-status/logo-192.png

  # _layout.svelte code en dur deux liens d'icône, l'un annoncé image/svg et
  # l'autre image/png, tous deux alimentés par cette clé. Un PNG rend donc le
  # second exact. Le premier restera mal typé tant que la marque n'aura pas de
  # SVG : `faviconSvg` n'est pas posée plutôt que de pointer un PNG de plus.
  favicon: https://2gather-platform.github.io/2gather-status/logo-192.png

  # Le lien d'accueil est relatif, pas `/` : Nav.svelte l'écrit tel quel, et
  # `/` mène à la racine de 2gather-platform.github.io, qui n'existe pas. La
  # balise <base> le résout vers l'accueil depuis n'importe quelle page.
  navbar:
    - title: État
      href: ./
    - title: Historique des relevés
      href: https://github.com/2gather-platform/2gather-status/commits/main
    - title: 2gather.events
      href: https://2gather.events
    - title: 2gather.me
      href: https://2gather.me

  # `metaTags` ne rend que l'attribut `name` : _layout.svelte écrit
  # `<meta name={link.name}>` et ignore tout le reste. Open Graph exige
  # `property`, donc ces balises-là passent par customHeadHtml, seul chemin
  # qui laisse écrire le HTML tel quel. Sans elles, un lien partagé vers la
  # page s'affiche nu, et c'est la seule situation où elle est vue par
  # quelqu'un qui ne l'a pas demandée.
  metaTags:
    - name: description
      content: État en temps réel des services 2gather, mesuré hors de leur infrastructure.
    - name: "twitter:card"
      content: summary_large_image
    - name: "twitter:title"
      content: État des services 2gather
    - name: "twitter:description"
      content: État en temps réel des services 2gather, mesuré hors de leur infrastructure.
    - name: "twitter:image"
      content: https://2gather.events/2gather/og.png

  # Sans cette clé, /robots.txt renvoie la page entière en 404, soit huit kilo-
  # octets de HTML là où trois lignes suffisent. Une page de statut a vocation
  # à être trouvée, donc tout est autorisé, explicitement plutôt que par défaut.
  robotsText: |
    User-agent: *
    Allow: /

  customHeadHtml: >-
    <meta property="og:site_name" content="2gather" />
    <meta property="og:title" content="État des services 2gather" />
    <meta property="og:description" content="État en temps réel des services 2gather, mesuré hors de leur infrastructure." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:locale:alternate" content="en_GB" />
    <meta property="og:locale:alternate" content="de_DE" />
    <meta property="og:url" content="https://2gather-platform.github.io/2gather-status/" />
    <meta property="og:image" content="https://2gather.events/2gather/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="alternate" type="application/atom+xml" title="Relevés de disponibilité 2gather" href="https://github.com/2gather-platform/2gather-status/commits/main.atom" />
    <link rel="apple-touch-icon" sizes="192x192" href="https://2gather-platform.github.io/2gather-status/logo-192.png" />

# La page de statut est écrite en anglais par défaut. Laisser des noms de
# service français sous des libellés anglais est la première chose qui se voit.
# `locale` ne fait pas que traduire : il gouverne le format des dates.
# Ces clés servent aussi à la table générée dans le README.
#
# Le français est la langue par défaut de la page, pas la seule : l'anglais et
# l'allemand vivent dans status-page/locales/. Toute clé, tout service et tout
# lien de navigation ajouté ici doit y être traduit, sans quoi la construction
# de la page échoue.
i18n:
  locale: fr-FR
  activeIncidents: Incidents en cours
  allSystemsOperational: Tous les services sont opérationnels
  incidentReport: "Voir le rapport de l'incident $NUMBER"
  activeIncidentSummary: "Ouvert le $DATE, $POSTS message(s)"
  incidentTitle: Détail de l'incident $NUMBER
  incidentDetails: Détail de l'incident
  incidentFixed: Résolu
  incidentOngoing: En cours
  incidentOpenedAt: Ouvert le
  incidentClosedAt: Clos le
  incidentViewOnGitHub: Consulter et suivre sur GitHub
  incidentCommentSummary: Publié le $DATE par $AUTHOR
  incidentBack: Retour à tous les incidents
  # Clés propres à la page multilingue, ignorées d'Upptime. Il titre ses
  # issues en anglais et en dur, « ⚠️ API has degraded performance » ; la page
  # les réécrit à l'affichage avec ces gabarits. Le type d'incident vient en
  # tête parce que plusieurs noms de service contiennent déjà une virgule.
  incidentTitleDown: "Indisponibilité : $NAME"
  incidentTitleDegraded: "Performances dégradées : $NAME"
  pastIncidents: Incidents passés
  pastIncidentsResolved: "Résolu en $MINUTES minutes, $POSTS message(s)"
  liveStatus: État en direct
  overallUptime: "Disponibilité globale : $UPTIME"
  overallUptimeTitle: Disponibilité globale
  averageResponseTime: "Temps de réponse moyen : $TIME ms"
  averageResponseTimeTitle: Temps de réponse moyen
  sevelDayResponseTime: Temps de réponse sur 7 jours
  responseTimeMs: Temps de réponse (ms)
  # Le carre de couleur fait partie de la valeur par defaut ("🟩 Up"), pas du
  # gabarit. Traduire sans le remettre le supprime de la table du README, ou
  # il est le seul indicateur d'etat de la ligne. Il est donc conserve ici, et
  # le theme rend les pastilles de la page neutres pour ne pas le doubler.
  up: 🟩 Opérationnel
  degraded: 🟨 Dégradé
  down: 🟥 Indisponible
  # Espace inclus dans la valeur : Summary.svelte et summary.ts concatenent
  # sans separateur, `{summary.time}{config.i18n.ms}`, ce qui rendait "471ms"
  # sur la page d'historique alors que l'accueil affichait "476 ms". En
  # francais l'unite se separe du nombre.
  ms: " ms"
  loading: Chargement
  navGitHub: GitHub
  footer: Cette page est [open source]($REPO), propulsée par [Upptime](https://upptime.js.org)
  pastScheduledMaintenance: Maintenances passées
  scheduledMaintenance: Maintenance planifiée
  scheduledMaintenanceSummaryStarted: "Commencée le $DATE, durée $DURATION minutes"
  scheduledMaintenanceSummaryStarts: "Commence le $DATE, durée $DURATION minutes"
  startedAt: Commencée le
  startsAt: Commence le
  duration: Durée
  durationMin: $DURATION minutes
  incidentCompleted: Terminée
  incidentScheduled: Planifiée
  duration24H: 24 h
  duration7D: 7 j
  duration30D: 30 j
  duration1Y: 1 an
  durationAll: tout
  errorTitle: Une erreur est survenue
  errorIntro: Impossible de récupérer l'état le plus récent des services.
  errorText: Réessayez dans quelques instants.
  errorHome: Revenir à l'accueil
  rateLimitExceededTitle: Limite de requêtes atteinte
  rateLimitExceededIntro: >-
    Vous avez dépassé le nombre de requêtes autorisées par heure. Attendez avant
    de consulter cette page à nouveau, ou ajoutez un jeton d'accès personnel
    GitHub pour continuer.
  rateLimitExceededWhatDoesErrorMean: Que signifie cette erreur ?
  rateLimitExceededErrorMeaning: >-
    Cette page interroge l'API GitHub pour afficher l'état des services en temps
    réel. GitHub autorise 60 requêtes par heure et par adresse IP, et ce quota
    est épuisé.
  rateLimitExceededErrorHowCanFix: Comment y remédier ?
  rateLimitExceededErrorFix: >-
    Le quota de votre adresse IP se rétablit au bout d'une heure. Vous pouvez
    aussi renseigner un jeton d'accès personnel GitHub, qui porte la limite à
    5 000 requêtes par heure.
  rateLimitExceededGeneratePAT: Comment générer un jeton d'accès personnel
  rateLimitExceededHasSet: Un jeton d'accès personnel est enregistré.
  rateLimitExceededRemoveToken: Retirer le jeton
  rateLimitExceededGitHubPAT: Jeton d'accès personnel GitHub
  rateLimitExceededCopyPastePAT: Collez votre jeton ici
  rateLimitExceededSaveToken: Enregistrer le jeton

  # Clés propres à la table générée du README. Elles ne figurent pas dans le
  # i18n.yml amont, qui ne couvre que la page : sans elles les en-têtes de
  # colonne et les textes alternatifs des badges restent en anglais.
  #
  # `liveStatusHtmlComment` est volontairement absente. Sa valeur par défaut
  # est le marqueur `<!--live status-->` que le README contient : la traduire
  # casserait le repère que le générateur vient remplacer.
  url: URL
  status: État
  history: Historique
  responseTime: Temps de réponse
  responseTimeDay: Temps de réponse sur 24 h
  responseTimeWeek: Temps de réponse sur 7 jours
  responseTimeMonth: Temps de réponse sur 30 jours
  responseTimeYear: Temps de réponse sur 1 an
  responseTimeGraphAlt: Graphe du temps de réponse
  uptime: Disponibilité
  uptimeDay: Disponibilité sur 24 h
  uptimeWeek: Disponibilité sur 7 jours
  uptimeMonth: Disponibilité sur 30 jours
  uptimeYear: Disponibilité sur 1 an
  degradedPerformance: 🟨 Performances dégradées
  partialOutage: 🟧 Panne partielle
  completeOutage: 🟥 Panne totale

# Seul `uptime` porte une contrainte réelle : c'est la fréquence de mesure.
# Les autres tâches ne font que reconstruire des vues à partir de l'historique.
# `updateTemplate` et `updates` sont déclenchés à la main, voir README.
workflowSchedule:
  graphs: "15 0 * * *"
  responseTime: "23 23 * * *"
  staticSite: "35 1 * * *"
  summary: "43 */6 * * *"
  updateTemplate: "0 0 * * *"
  updates: "0 3 * * *"
  uptime: "2-59/5 * * * *"

# Par défaut Upptime supprime les issues d'incident refermées en moins de
# quinze minutes. La plupart des pannes durent moins que ça : sans ce réglage,
# l'historique des incidents perd précisément les cas les plus fréquents.
skipDeleteIssues: true

assignees:
  - Asteerix

skipDescriptionUpdate: true
skipTopicsUpdate: true
skipHomepageUpdate: true

# Les relevés sont commités sous le compte qui exploite le dépôt, pas sous
# l'identité générique d'Upptime. Les messages restent ceux d'Upptime : le
# calcul de disponibilité et des temps de réponse les relit tels quels.
commitMessages:
  commitAuthorName: Amaury Poltavtseef
  commitAuthorEmail: 34680117+Asteerix@users.noreply.github.com
