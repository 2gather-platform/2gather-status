# Version allemande de la page de statut. Mêmes clés que locales/en.yml, voir
# l'en-tête de ce fichier. Vouvoiement, comme le veut l'usage pour une page
# publique.

name: Status der 2gather-Dienste
introTitle: Status der 2gather-Dienste
introMessage: >-
  Verfügbarkeit der 2gather-Dienste, gemessen von GitHub-Actions-Runnern und
  damit außerhalb der überwachten Infrastruktur. Eine Messung wird alle fünf
  Minuten angefordert, GitHub führt sie in der Praxis jedoch nur etwa alle
  dreißig Minuten aus, manchmal seltener. Eine Unterbrechung, die kürzer ist
  als dieser Abstand, kann daher unbemerkt bleiben. Jede Messung wird in den
  öffentlichen Verlauf des Repositorys aufgenommen, und jede Unterbrechung
  eröffnet ein datiertes Issue, das bei Wiederherstellung geschlossen wird.

navbar:
  "./": Status
  "https://github.com/2gather-platform/2gather-status/commits/main": Messverlauf
  "https://2gather.events": 2gather.events
  "https://2gather.me": 2gather.me

# « Events » plutôt que « Veranstaltungen » : c'est le nom du produit,
# 2gather.events, et l'usage courant en allemand dans ce contexte.
