# Version anglaise de la page de statut. Chaque clé double son équivalent
# français de .upptimerc.yml : `name`, `introTitle` et `introMessage` sous
# `status-website`, les titres de `navbar` repérés par leur `href`, les noms
# de service par leur `slug`, et les libellés de la page sous `i18n`.
#
# La construction échoue si une clé manque ou n'existe pas côté français :
# ajouter un service ou un lien de navigation, c'est le traduire ici aussi.

name: 2gather service status
introTitle: 2gather service status
introMessage: >-
  Availability of 2gather services, measured from GitHub Actions runners,
  outside the monitored infrastructure. A check is requested every five
  minutes; in practice GitHub runs it roughly every thirty minutes, sometimes
  less often, so an outage shorter than that interval may go unnoticed. Every
  measurement is added to the repository's public history, and an outage opens
  a dated issue that is closed once service is restored.

navbar:
  "./": Status
  "https://github.com/2gather-platform/2gather-status/commits/main": Check history
  "https://2gather.events": 2gather.events
  "https://2gather.me": 2gather.me

sites:
  api: API
  api-acces-base-de-donnees: API, database access
  application-web-evenements: Events web app
  application-web-profils: Profiles web app
  domaine-principal: Main domain
  liens-universels: App universal links
  administration-production: Admin console, production
  administration-evenements: Admin console, events
  administration-profils: Admin console, profiles (access portal)

