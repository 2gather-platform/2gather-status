<!DOCTYPE html>
<html lang="%status.lang%">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <meta name="theme-color" content="#333333" />
    <script>
      // Choisit la langue avant tout rendu : `?lang=` dans l'adresse, sinon le
      // choix mémorisé par le sélecteur, sinon la première langue du navigateur
      // que la page sait parler, sinon la langue de repli. Le résultat est posé
      // sur <html lang>, où src/i18n.js le relit au démarrage.
      //
      // Le HTML exporté est dans la langue par défaut. Pour une autre langue,
      // la page reste masquée jusqu'à ce que l'application l'ait rendue, plutôt
      // que d'afficher du français qui bascule une fraction de seconde après.
      (function (languages) {
        var pick = function (value) {
          var code = String(value || "").toLowerCase().split("-")[0];
          return languages.supported.indexOf(code) === -1 ? null : code;
        };
        var language = null;
        try {
          language = pick(new URLSearchParams(location.search).get("lang"));
        } catch (error) {}
        try {
          language = language || pick(localStorage.getItem(languages.storageKey));
        } catch (error) {}
        var preferred = navigator.languages || [navigator.language];
        for (var i = 0; !language && i < preferred.length; i++) language = pick(preferred[i]);
        language = language || languages.fallback;

        var root = document.documentElement;
        root.lang = language;
        if (language === languages.default) return;
        root.classList.add("i18n-pending");
        // Filet de sécurité : si l'application ne démarre pas, mieux vaut la
        // page dans la langue par défaut qu'une page blanche.
        setTimeout(function () {
          root.classList.remove("i18n-pending");
        }, 4000);
      })(%status.languages%);
    </script>
    <style>
      .i18n-pending #sapper {
        visibility: hidden;
      }
    </style>
    %sapper.base%
    <link rel="manifest" href="manifest.json" crossorigin="use-credentials" />
    %sapper.scripts% %sapper.styles% %sapper.head%
  </head>
  <body>
    <div id="sapper">%sapper.html%</div>
    <script>
      try {
        if (typeof window !== "undefined" && window.navigator && navigator.serviceWorker) {
          navigator.serviceWorker.getRegistrations().then(function (registrations) {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
        }
        if (typeof window !== "undefined" && "caches" in window) {
          caches.keys().then(function (keyList) {
            return Promise.all(
              keyList.map(function (key) {
                return caches.delete(key);
              })
            );
          });
        }
      } catch (error) {}
    </script>
  </body>
</html>
